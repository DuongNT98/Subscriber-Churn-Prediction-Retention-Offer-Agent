[project]
name = "tel-c2-016"
version = "0.1.0"
description = "Subscriber Churn Prediction & Retention Offer Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI, varying by repo generation — a local on-PYTHONPATH stub for
# older repos, or installed from the package registry for newer repos (see the
# dual-mode test job in the CI pipeline configuration). Pinning it here would
# make `pip install -e .` fail because it is not resolvable from the default
# index.
# pyyaml is a real runtime dependency: src/services/service.py + PB-7 read
# config/config.yaml and config/retention_offers.yaml via yaml.safe_load.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260906",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# framework/shared: the SDK ships no py.typed marker (PEP 561), so every import
# resolves to Any and disallow_subclassing_any (below) fires on every node/graph
# class - a real, structural mypy strict-mode finding, not a bug in this repo.
# langgraph: same missing-stubs situation, but ALSO not followed (follow_imports
# = "skip") - analyzing its source pulls in a numpy stub using PEP 695 `type`
# syntax that only parses under python_version >= 3.12, crashing mypy entirely
# under an older local interpreter/numpy pairing (observed on a local Python
# 3.14 venv). Skipping avoids that local-environment crash without changing
# what we actually verify (we don't need langgraph's own internals type-checked).
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true
follow_imports = "skip"
