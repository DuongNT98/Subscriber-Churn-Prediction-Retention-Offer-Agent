# Runtime parameters — loaded by AgentRegistry, passed as Graph(config=...).
# This is a SEPARATE file from config/agent.yaml (the static manifest): agent.yaml
# is AgentRegistry's discovery entry point, this file is the agent's own runtime
# config, keyed by whatever your Graph/node code reads via self.config.get(...).
# See the framework reference docs for the agent.yaml / config.yaml split of responsibility.

max_retry: 3
timeout_s: 30

# No HITL / persistent memory in this template — churn forecast, risk
# segmentation, offer selection, and dispatch are fully automated (no
# human-in-the-loop interrupt anywhere in src/nodes/).
# memory_enabled: false
# hitl:
#   enabled: false
#   max_hitl: 5
