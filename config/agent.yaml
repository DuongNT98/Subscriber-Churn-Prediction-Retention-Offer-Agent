# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. That nested shape is
# invisible to the registry (falls back to defaults / KeyErrors); see the
# framework's AgentRegistry manifest schema reference for the full contract.
id: "TEL-C2-016"
name: "Subscriber Churn Prediction & Retention Offer Agent"
namespace: "tel"
version: "0.1.0"
enabled: true
category: "Cat 2"
# Static generation contract. LLM (Azure OpenAI) renders offer copy
# (OfferSelectNode) and the campaign narrative (CampaignReportNode); both
# nodes fall back to deterministic template text when no LLM resolves for
# this invocation (missing secret, API error, etc.) - never a hard failure.
generation_mode: "llm"
industry: "TEL"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "DocGenerationAgent"

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.TELChurnRetentionAgent"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled.
# All three are resolved via ctx.secrets.require(...) inside
# src/services/llm_provider.py::resolve_llm() at invocation time, not at
# server boot - a missing/invalid value there is caught and degrades to the
# deterministic fallback (never a hard failure), so require_at_compile()
# staying unwired for standalone deploys (Phase 3a; see framework/secrets/base.py)
# does not change that runtime behavior.
requires:
  secrets: ["AZURE_OPENAI_API_KEY", "AZURE_OPENAI_ENDPOINT", "AZURE_OPENAI_DEPLOYMENT"]
  extras: ["openai"]  # AzureOpenAIClient wraps langchain_openai.ChatOpenAI; must exist in shared/utils/extras_map.py EXTRAS_MAP

# generation_mode is deployment identity, not a tunable provider setting. Runtime parameters
# (max_retry, timeout_s, hitl, memory_enabled, ...) live in
# config/config.yaml — AgentRegistry loads that file separately and passes it
# as Graph(config=...). Do NOT put them here.
